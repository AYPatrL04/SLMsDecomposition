[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-decomposition"
version = "1.0.0"
description = "Reproduce hierarchical full-workings decomposition on MathGAP arithmetic chains"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6", "transformers==5.20.1", "accelerate>=1.0",
  "numpy>=1.26", "PyYAML>=6", "filelock>=3.15",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
